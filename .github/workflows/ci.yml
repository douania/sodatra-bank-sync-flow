name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TODO OPS-ESLINT-BASELINE-1: make lint blocking once existing lint debt is resolved.
      - name: Lint (advisory — existing repo debt)
        continue-on-error: true
        run: npm run lint

      # OPS-LINT-RATCHET-1: lint stays advisory above, but ESLint debt must not
      # grow past the measured baseline. PACK 0 re-measured it on origin/main
      # 3c69e7d with the lockfile versions (Node 20.20.2, npm 10.8.2,
      # `npm ci` + `npx eslint . -f json`): 180 errors, 11 warnings, 191 total
      # (previous audited ceiling: 212 / 11 / 223). Fails only if errors > 180
      # or total > 191, so turning an error into a warning still passes.
      # Re-measure with docs/BASELINES.md §5 before changing these numbers;
      # never raise them to hide a regression.
      - name: ESLint ratchet
        run: |
          set +e
          npm run --silent lint -- --format json > "$RUNNER_TEMP/eslint-report.json"
          lint_exit=$?
          set -e
          echo "ESLint exit code: $lint_exit"

          if [ "$lint_exit" -ge 2 ]; then
            echo "ESLint crashed instead of reporting problems (exit $lint_exit)." >&2
            exit "$lint_exit"
          fi

          node <<'NODE'
          const fs = require('fs');

          const baseline = {
            errors: 180,
            warnings: 11,
            total: 191,
          };

          const reportPath = process.env.RUNNER_TEMP + '/eslint-report.json';
          const raw = fs.readFileSync(reportPath, 'utf8').trim();

          if (!raw) {
            console.error('ESLint JSON report is empty.');
            process.exit(1);
          }

          let report;
          try {
            report = JSON.parse(raw);
          } catch (error) {
            console.error('Failed to parse ESLint JSON report.');
            console.error(error);
            process.exit(1);
          }

          const totals = report.reduce(
            (acc, file) => {
              acc.errors += file.errorCount || 0;
              acc.warnings += file.warningCount || 0;
              if ((file.errorCount || 0) + (file.warningCount || 0) > 0) {
                acc.files += 1;
              }
              return acc;
            },
            { errors: 0, warnings: 0, files: 0 }
          );

          totals.total = totals.errors + totals.warnings;

          console.log('ESLint ratchet summary');
          console.log(`Errors: ${totals.errors} / baseline ${baseline.errors}`);
          console.log(`Warnings: ${totals.warnings} / baseline ${baseline.warnings}`);
          console.log(`Total: ${totals.total} / baseline ${baseline.total}`);
          console.log(`Files with problems: ${totals.files}`);

          const failed = totals.total > baseline.total || totals.errors > baseline.errors;

          if (failed) {
            console.error('ESLint debt increased above baseline.');
            process.exit(1);
          }

          console.log('ESLint debt is within baseline.');
          NODE

      - name: Structured statement and Daily v2 tests
        run: |
          npm run test:structured-csv-all
          npm run test:structured-csv-e2b
          npm run test:structured-excel
          npm run test:daily-v2-application
          npm run test:daily-v2-reporting
          npx tsx --test src/features/daily-v2/dashboard/*.synthetic.test.ts src/features/daily-v2/dashboard/*.synthetic.test.tsx
          npx tsx --test src/features/daily-v2/session/*.synthetic.test.ts src/features/daily-v2/session/*.synthetic.test.tsx src/features/daily-v2/dailyV2AccessState.synthetic.test.ts
          npm run test:collections-core
          npm run test:auth-signin
          npm run test:bdk-pdf
          npm run test:upload-guard
          npm run test:financial-atomic
          npm run test:financial-write-lockdown
          npm run test:import-preflight
          npm run test:multi-bank-reports

      # PACK 0 — critical blockers and governance: consultative quality
      # control, legacy Collection write-path isolation, xlsx upgrade
      # characterization (business results identical before/after), build
      # provenance, and the Internal Book diagnostic parsers.
      - name: Pack 0 contracts (quality control, legacy isolation, xlsx, provenance, Internal Book)
        run: |
          npm run test:quality-control
          npm run test:legacy-isolation
          npm run test:xlsx-characterization
          npm run test:build-provenance
          npm run test:internal-book

      - name: Collection Report atomic activation contract (PostgreSQL 17)
        shell: pwsh
        run: ./supabase/tests/collection_report_controlled_activation/run_pg17_replay.ps1

      # PACK 0 (GO_FIX_PACK_0 Node typing) — blocking: the Node project
      # (vite.config.ts and the modules it imports, e.g. the build provenance
      # collector) must typecheck with zero errors. The application project
      # keeps its measured baseline (docs/BASELINES.md §3); `tsc -b`, used by
      # the Lovable preview typecheck, is the sum of both.
      - name: TypeScript (Node project, zero errors)
        run: npx tsc -p tsconfig.node.json --noEmit

      - name: Build
        run: npm run build

      # PACK 0 (D-0-4, GO_FIX_PACK_0 provenance) — blocking proof on a REAL Vite
      # build: a clean detached worktree of the checkout actually built here
      # (on pull_request, the PR test-merge commit — never a substituted SHA)
      # is compiled and the provenance embedded in the produced bundle must be
      # known / git-checkout / corroborated / clean and carry that HEAD; the
      # build must leave the source tree untouched. Also proves that only the
      # Vite config temp file is ignored while real untracked sources and
      # tracked modifications are still detected.
      - name: Build provenance from a clean checkout (real Vite build)
        run: npx tsx --test src/config/buildProvenance.build.test.ts

      - name: Production log hygiene contract
        run: npx tsx --test src/config/productionLogHygiene.synthetic.test.ts
